<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفاجأة عيد ميلاد أميرة قلبي ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at center, #2e0821 0%, #150310 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .glow-text {
            text-shadow: 0 0 20px rgba(244, 63, 94, 0.6);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- 🎵 مشغل يوتيوب مخفي (أغنية العسيلي) -->
    <iframe id="yt-player" class="hidden" width="0" height="0" 
            src="https://www.youtube.com/embed/lDMrnbizHWU?enablejsapi=1&loop=1&playlist=lDMrnbizHWU" 
            allow="autoplay">
    </iframe>

    <!-- 🔐 1. شاشة الباسورد (الغموض) -->
    <div id="lock-screen" class="fixed inset-0 z-50 bg-[#12030d] flex items-center justify-center p-4">
        <div class="glass-card max-w-md w-full p-8 rounded-3xl text-center space-y-6 shadow-2xl border-rose-500/40">
            <div class="w-20 h-20 mx-auto bg-rose-600 rounded-full flex items-center justify-center text-3xl shadow-lg shadow-rose-600/50 animate-bounce">
                🎁
            </div>
            <div class="space-y-2">
                <h2 class="text-2xl font-black text-rose-200">مفاجأة خاصة جداً 🤫❤️</h2>
                <p class="text-slate-300 text-sm leading-relaxed">اكتبي تاريخ أول مرة اتكلمنا فيها سناب أو واتس 📅</p>
            </div>
            <div class="space-y-4">
                <input type="text" id="pass-input" placeholder="اكتبي الباسورد هنا (مثلاً 20/10)..." class="w-full px-5 py-3 rounded-xl bg-black/50 border border-rose-500/40 text-center text-rose-200 focus:outline-none focus:border-rose-500 font-bold text-lg">
                <button onclick="checkPassword()" class="w-full py-3 bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 hover:to-pink-500 font-bold rounded-xl shadow-lg shadow-rose-600/40 transition-all transform hover:scale-[1.02]">
                    افتحي الهدية ✨
                </button>
                <p id="error-msg" class="text-rose-400 text-sm font-semibold hidden">الباسورد مش صح يا حب! حاولي تاني 😜</p>
            </div>
        </div>
    </div>

    <!-- 🎉 2. الصفحة الثانية (الترحيب والأغنية والزينة) -->
    <div id="page-2" class="hidden max-w-xl mx-auto w-full text-center space-y-8 p-6 glass-card rounded-3xl shadow-2xl border-rose-500/30">
        <div class="text-5xl animate-bounce">🎉❤️🎈</div>
        
        <div class="space-y-3">
            <h1 class="text-4xl md:text-5xl font-black glow-text bg-gradient-to-r from-rose-300 via-pink-400 to-amber-200 bg-clip-text text-transparent">
                Happy Birthday!
            </h1>
            <div class="text-rose-200 text-xl font-bold space-y-2 pt-2">
                <p>كل سنة وأنتِ جنبي ❤️</p>
                <p>كل سنة وأنتِ ضهري وسندي ✨</p>
            </div>
        </div>

        <div class="pt-4">
            <button onclick="alert('جاهزين للخطوة الجاية: صفحة الـ 10 صور!')" class="px-8 py-3 bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 hover:to-pink-500 font-bold rounded-xl shadow-lg shadow-rose-600/40 transition-all transform hover:scale-105">
                Next ➡️
            </button>
        </div>
    </div>

    <script>
        // 🔑 الباسورد المحدّث
        const CORRECT_PASS = "20/10";

        function checkPassword() {
            const input = document.getElementById('pass-input').value.trim();
            if (input === CORRECT_PASS || input === "2010") { // حطيت الاحتمالين عشان لو كتبتها بالشرطة أو من غيرها تشتغل
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('page-2').classList.remove('hidden');
                
                const iframe = document.getElementById('yt-player');
                iframe.src += "&autoplay=1";
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
